<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobin Gift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #060913; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .wrapper { width: 100%; max-width: 400px; background: rgba(13, 19, 33, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; text-align: center; background: linear-gradient(135deg, #ec4899, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
        .status-box { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px 16px; border-radius: 12px; margin-bottom: 15px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05); }
        .badge { padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; }
        .badge.online { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.offline { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .announcement { background: rgba(236, 72, 153, 0.1); border: 1px solid rgba(236, 72, 153, 0.3); padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 15px; text-align: center; color: #f472b6; }
        .gift-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; text-decoration: none; color: inherit; transition: 0.2s; }
        .gift-item:hover { background: rgba(236, 72, 153, 0.08); border-color: rgba(236, 72, 153, 0.3); }
        .price { font-family: 'Orbitron', sans-serif; color: #10b981; font-size: 0.85rem; font-weight: 600; }
        .support-btn { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #ec4899, #6366f1); color: white; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="logo">Mobin Gift</div>
        
        <div class="status-box">
            <span>وضعیت ربات:</span>
            <span id="botStatusBadge" class="badge">در حال بررسی...</span>
        </div>

        <div id="announcementBox" class="announcement" style="display: none;"></div>

        <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 8px;">🎁 گیفت‌های تلگرام</div>
        <div id="giftContainer"></div>

        <a id="supportLink" href="#" target="_blank" class="support-btn">ارتباط با پشتیبانی 💬</a>
    </div>

    <script>
        async function initShop() {
            try {
                // خواندن فایل config.json با جلوگیری از کش
                const response = await fetch('config.json?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to load config');
                
                const config = await response.json();

                // ۱. تنظیم وضعیت ربات
                const badge = document.getElementById('botStatusBadge');
                if (config.bot_status === true) {
                    badge.className = 'badge online';
                    badge.textContent = 'آنلاین و فعال ✅';
                } else {
                    badge.className = 'badge offline';
                    badge.textContent = 'خاموش / آفلاین ❌';
                }

                // ۲. نمایش اطلاعیه اگر وجود داشت
                if (config.announcement && config.announcement.trim() !== "") {
                    const annBox = document.getElementById('announcementBox');
                    annBox.textContent = config.announcement;
                    annBox.style.display = 'block';
                }

                // ۳. لیست گیفت‌ها
                const container = document.getElementById('giftContainer');
                container.innerHTML = '';
                
                const botUser = config.bot_username || 'Mobin_Gift_Bot';

                for (const [key, gift] of Object.entries(config.gifts || {})) {
                    container.innerHTML += `
                        <a href="https://t.me/${botUser}" target="_blank" class="gift-item">
                            <div>
                                <div style="font-weight: 600; font-size: 0.95rem;">${gift.name}</div>
                            </div>
                            <div class="price">${gift.price}</div>
                        </a>
                    `;
                }

                // ۴. لینک پشتیبانی
                if (config.support_username) {
                    document.getElementById('supportLink').href = `https://t.me/${config.support_username}`;
                }

            } catch (err) {
                console.error(err);
                document.getElementById('botStatusBadge').textContent = 'خطا در بارگذاری اطلاعات!';
            }
        }

        initShop();
    </script>
</body>
</html>
