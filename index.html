<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobin Gift - Telegram Gifts Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --bg-color: #060913;
            --card-bg: rgba(13, 19, 33, 0.8);
            --accent-green: #10b981;
            --accent-pink: #ec4899;
            --primary-glow: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            right: -100px;
            animation: pulseOrb 6s infinite alternate ease-in-out;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            left: -100px;
            animation: pulseOrb 8s infinite alternate-reverse ease-in-out;
            z-index: 0;
        }

        @keyframes pulseOrb {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .screen {
            display: none;
            width: 100%;
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #langScreen {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.3));
        }

        .lang-btns {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-lang {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-lang:hover {
            border-color: var(--accent-pink);
            background: rgba(236, 72, 153, 0.1);
            transform: translateY(-2px);
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ec4899, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-icon {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn-icon:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }

        .bot-status-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-badge.online {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        .online .dot { background: var(--accent-green); }
        .offline .dot { background: #ef4444; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .box-container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .box-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gift-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gift-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .gift-item:hover {
            background: rgba(236, 72, 153, 0.06);
            border-color: rgba(236, 72, 153, 0.3);
            transform: translateX(2px);
        }

        .gift-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .gift-name {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .gift-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
        }

        .gift-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .support-card {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.12), rgba(99, 102, 241, 0.12));
            border: 1px solid rgba(236, 72, 153, 0.25);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }

        .support-btn {
            display: inline-block;
            margin-top: 10px;
            background: linear-gradient(135deg, #ec4899, #6366f1);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
            transition: 0.2s;
        }

        .support-btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            padding: 16px;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #0f172a;
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .modal-overlay.show .modal-box {
            transform: scale(1);
        }

        .modal-btn {
            width: 100%;
            margin-top: 14px;
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }

        .modal-btn.bot-action {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
        }

        .modal-btn.secondary {
            background: rgba(255, 255, 255,.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .modal-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div id="langScreen" class="screen active">
            <div class="logo-title">Mobin Gift</div>
            <p style="color: var(--text-muted); font-size: 0.9rem;" id="langSubText">لطفاً زبان خود را انتخاب کنید / Please select language</p>
            <div class="lang-btns">
                <button class="btn-lang" onclick="setLanguage('fa')">فارسی 🇮🇷</button>
                <button class="btn-lang" onclick="setLanguage('en')">English 🇺🇸</button>
            </div>
        </div>

        <div id="mainScreen" class="screen">
            <div class="main-header">
                <div class="main-title">Mobin Gift</div>
                <button class="btn-icon" onclick="goBackToLang()" id="langSwitchBtn">🌐 زبان</button>
            </div>

            <div class="bot-status-card">
                <span id="botStatusLabel">وضعیت ربات تلگرام:</span>
                <div id="botStatusBadge" class="status-badge online">
                    <span class="dot"></span>
                    <span id="botStatusText">ربات آنلاین است</span>
                </div>
            </div>

            <div class="box-container">
                <div class="box-title">
                    <span>🎁</span> <span id="giftsTitleText">گیفت‌های تلگرام</span>
                </div>
                <div class="gift-list" id="giftListContainer"></div>
            </div>

            <div class="support-card">
                <h3 id="supportHeader" style="font-size: 1rem;">پشتیبانی مجموعه</h3>
                <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px;" id="supportDesc">برای هرگونه سوال یا پیگیری در ارتباط باشید</p>
                <a href="#" target="_blank" class="support-btn" id="supportBtnLink">ارتباط با پشتیبانی</a>
            </div>
        </div>
    </div>

    <!-- مودال اطلاعیه و خرید -->
    <div id="purchaseModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalGiftIcon" style="font-size: 2.2rem; margin-bottom: 6px;">🎁</div>
            <h3 id="modalGiftName" style="margin-bottom: 6px; font-size: 1.1rem;">نام گیفت</h3>
            <p id="modalGiftPrice" style="color: var(--accent-green); font-family: 'Orbitron', sans-serif; font-size: 1rem; margin-bottom: 14px;"></p>
            
            <p id="modalDescText" style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; margin-bottom: 10px;"></p>

            <a href="#" id="goToBotBtn" target="_blank" class="modal-btn bot-action">ورود به ربات و پرداخت 🤖</a>
            <button class="modal-btn secondary" onclick="closePurchaseModal()" id="closeModalBtn">انصراف</button>
        </div>
    </div>

    <script>
        // دیتای خالی اولیه تا حتماً از فایل config.json خوانده شود
        let globalConfig = null;
        let currentLang = 'fa';

        // لود اجباری فایل config.json با پارامتر زمان برای جلوگیری از کش شدن
        async function loadConfig() {
            try {
                const res = await fetch('config.json?v=' + new Date().getTime());
                if (res.ok) {
                    globalConfig = await res.json();
                }
            } catch (e) {
                console.log('Error loading config.json', e);
            }
        }

        async function setLanguage(lang) {
            currentLang = lang;
            
            // منتظر می‌مانیم تا اطلاعات جدید حتماً از گیت‌هاب خوانده شود
            if (!globalConfig) {
                await loadConfig();
            }

            // اگر باز هم به هر دلیلی نخواند، مقادیر پیش‌فرضِ مطابق با فایل شما اعمال می‌شود
            if (!globalConfig) {
                globalConfig = {
                    "bot_status": false,
                    "announcement": "ربات در حال حاضر خاموش است",
                    "bot_username": "Mobin_Gift_Bot",
                    "support_username": "Mobin_VPN_Admin",
                    "gifts": {
                        "bear": { "name": "🧸 خرس", "price": "100,000 تومان", "stars": "50 Stars" },
                        "heart": { "name": "💝 قلب", "price": "115,000 تومان", "stars": "75 Stars" },
                        "rocket": { "name": "🚀 موشک", "price": "270,000 تومان", "stars": "150 Stars" }
                    }
                };
            }

            const htmlTag = document.getElementById('htmlTag');
            const langScreen = document.getElementById('langScreen');
            const mainScreen = document.getElementById('mainScreen');

            if (lang === 'fa') {
                htmlTag.setAttribute('dir', 'rtl');
                htmlTag.setAttribute('lang', 'fa');
                document.getElementById('langSwitchBtn').textContent = '🌐 زبان / Language';
                document.getElementById('giftsTitleText').textContent = 'گیفت‌های تلگرام';
                document.getElementById('supportHeader').textContent = 'پشتیبانی مجموعه';
                document.getElementById('supportDesc').textContent = 'برای هرگونه سوال یا پیگیری در ارتباط باشید';
                document.getElementById('supportBtnLink').textContent = 'ارتباط با پشتیبانی';
                document.getElementById('botStatusLabel').textContent = 'وضعیت ربات تلگرام:';
                document.getElementById('goToBotBtn').textContent = 'ورود به ربات و پرداخت 🤖';
                document.getElementById('closeModalBtn').textContent = 'انصراف';
            } else {
                htmlTag.setAttribute('dir', 'ltr');
                htmlTag.setAttribute('lang', 'en');
                document.getElementById('langSwitchBtn').textContent = '🌐 Language / زبان';
                document.getElementById('giftsTitleText').textContent = 'Telegram Gifts';
                document.getElementById('supportHeader').textContent = 'Support Center';
                document.getElementById('supportDesc').textContent = 'Contact admin for orders and assistance';
                document.getElementById('supportBtnLink').textContent = 'Contact Support';
                document.getElementById('botStatusLabel').textContent = 'Telegram Bot Status:';
                document.getElementById('goToBotBtn').textContent = 'Open Bot & Pay 🤖';
                document.getElementById('closeModalBtn').textContent = 'Cancel';
            }

            // تنظیم وضعیت ربات بر اساس فیلد فایل جیسون
            const badge = document.getElementById('botStatusBadge');
            const statusText = document.getElementById('botStatusText');
            if (globalConfig.bot_status === true) {
                badge.className = 'status-badge online';
                statusText.textContent = (lang === 'fa') ? 'ربات آنلاین است' : 'Bot is Online';
            } else {
                badge.className = 'status-badge offline';
                statusText.textContent = (lang === 'fa') ? 'ربات موقتاً خاموش است' : 'Bot is Offline';
            }

            document.getElementById('supportBtnLink').href = `https://t.me/${globalConfig.support_username}`;

            const container = document.getElementById('giftListContainer');
            container.innerHTML = '';
            
            const gifts = globalConfig.gifts || {};
            for (const [key, gift] of Object.entries(gifts)) {
                const priceText = gift.price || '';
                const subText = gift.stars || '';
                container.innerHTML += `
                    <div class="gift-item" onclick='openPurchaseModal(${JSON.stringify(gift)})'>
                        <div class="gift-info">
                            <span class="gift-name">${gift.name}</span>
                            <span class="gift-sub">${subText}</span>
                        </div>
                        <span class="gift-price">${priceText}</span>
                    </div>
                `;
            }

            // اگر اطلاعیه در جیسون وجود داشت، به محض ورود به صفحه اصلی به عنوان پاپ‌آپ نمایش داده می‌شود
            if (globalConfig.announcement && globalConfig.announcement.trim() !== "") {
                openAnnouncementModal(globalConfig.announcement);
            }

            langScreen.classList.remove('active');
            setTimeout(() => { mainScreen.classList.add('active'); }, 150);
        }

        function openAnnouncementModal(text) {
            document.getElementById('modalGiftIcon').textContent = '📢';
            document.getElementById('modalGiftName').textContent = (currentLang === 'fa') ? 'اطلاعیه مهم' : 'Important Notice';
            document.getElementById('modalGiftPrice').style.display = 'none';
            document.getElementById('modalDescText').textContent = text;
            
            const botUser = globalConfig.bot_username || 'Mobin_Gift_Bot';
            document.getElementById('goToBotBtn').href = `https://t.me/${botUser}`;
            document.getElementById('goToBotBtn').textContent = (currentLang === 'fa') ? 'ورود به ربات تلگرام 🤖' : 'Open Telegram Bot 🤖';
            
            document.getElementById('purchaseModal').classList.add('show');
        }

        function openPurchaseModal(gift) {
            document.getElementById('modalGiftIcon').textContent = '🎁';
            document.getElementById('modalGiftName').textContent = gift.name;
            const priceText = gift.price || '';
            document.getElementById('modalGiftPrice').style.display = 'block';
            document.getElementById('modalGiftPrice').textContent = priceText;
            
            const botUser = globalConfig.bot_username || 'Mobin_Gift_Bot';
            document.getElementById('goToBotBtn').href = `https://t.me/${botUser}`;
            document.getElementById('goToBotBtn').textContent = (currentLang === 'fa') ? 'ورود به ربات و پرداخت 🤖' : 'Open Bot & Pay 🤖';
            
            if (currentLang === 'fa') {
                document.getElementById('modalDescText').textContent = globalConfig.bot_status === false 
                    ? '⚠️ ربات در حال حاضر خاموش است، اما می‌توانید وارد ربات شوید یا پیام بگذارید.' 
                    : 'برای پرداخت نهایی، کارت به کارت و ارسال رسید، لطفاً وارد ربات تلگرامی ما شوید.';
            } else {
                document.getElementById('modalDescText'].textContent = globalConfig.bot_status === false
                    ? '⚠️ Bot is currently offline, but you can still open it.'
                    : 'For final payment, card transfer, and sending receipt, please open our Telegram bot.';
            }

            document.getElementById('purchaseModal').classList.add('show');
        }

        function closePurchaseModal() {
            document.getElementById('purchaseModal').classList.remove('show');
        }

        function goBackToLang() {
            document.getElementById('mainScreen').classList.remove('active');
            setTimeout(() => { document.getElementById('langScreen').classList.add('active'); }, 150);
        }
    </script>
</body>
</html>
